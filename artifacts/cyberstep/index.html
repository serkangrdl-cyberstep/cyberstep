    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "CyberStep.io nedir?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CyberStep.io, Türkiye'deki kuruluşların tedarikçilerinin siber risk durumunu skorlayan bir platformdur. Tedarikçilerin internetten görünen güvenlik duruşunu (açık servisler, bilinen güvenlik açıkları, e-posta güvenliği yapılandırması, sertifika durumu ve sızmış kimlik bilgisi kayıtları) kamuya açık kaynaklardan okuyarak puanlar."
          }
        },
        {
          "@type": "Question",
          "name": "Dışarıdan yapılan tarama neyi göstermez?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dışarıdan tarama tedarikçinin iç yetki yönetimini, süreçlerini ve verinin nerede tutulduğunu göstermez. Bu nedenle sonuçlar tedarikçi anketi, sözleşme güvenlik maddeleri ve belge talebiyle birlikte kullanılmalıdır."
          }
        },
        {
          "@type": "Question",
          "name": "Alan adı güvenlik taraması ücretsiz mi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Evet. CyberStep.io'nun alan adı güvenlik taraması ücretsizdir; SPF, DMARC, DKIM, SSL sertifikası ve açık port gibi dışarıdan görünen ayarları kontrol eder."
          }
        },
        {
          "@type": "Question",
          "name": "KVKK tedarikçi riski yönetimini zorunlu kılıyor mu?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KVKK madde 12/2'ye göre kişisel veriler sizin adınıza başka biri tarafından işleniyorsa, veri güvenliği tedbirlerinin alınmasından o kişiyle müştereken sorumlusunuz. Madde bir tedarikçi risk yönetimi programını açıkça zorunlu kılmaz; ancak tedarikçi seçimini ve denetimini önemli kılar."
          }
        }
      ]
    }
